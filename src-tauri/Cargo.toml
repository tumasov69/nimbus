[package]
name = "nimbus"
version = "0.5.3"
description = "Nimbus — a modern, lightweight Minecraft launcher"
authors = ["qqqex"]
edition = "2021"

[lib]
name = "nimbus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lyceris = "1.1.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
uuid = { version = "1", features = ["v4", "v5"] }
zip = "2"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
sysinfo = "0.33"
url = "2"
fastnbt = "2"
flate2 = "1"
discord-rich-presence = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[profile.release]
opt-level = "z"
# Thin LTO: parallel, much faster to link than full LTO, ~same binary size.
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
